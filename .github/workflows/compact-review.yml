name: Compact layout review
on:
  push:
    branches: [ux/compact-play-v10]
permissions:
  contents: write
concurrency:
  group: compact-play-v10-review
  cancel-in-progress: true
jobs:
  compact-review:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact migration on the review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/ux/compact-play-v10
          if ! grep -q "mini-games-v10" sw.js; then
            python3 tools/apply-compact-layout.py
          fi
          find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          npm test
      - name: Prepare browser checks
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/compact-preview.log 2>&1 &
          sleep 2
      - name: Check menus, all games, saves, drag and offline mode
        run: |
          node tests/compact-play.mjs
          node tests/visual-smoke.mjs
          node tests/responsive-smoke.mjs
          node tests/cache-recovery.mjs
      - name: Commit only tested application changes to review branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js arcade blocks match3 solitaire shared tests
          if ! git diff --cached --quiet; then
            git commit -m 'Apply tested compact UI to all 12 games'
            git push origin HEAD:refs/heads/ux/compact-play-v10
          fi
          git rev-parse HEAD > qa/screenshots/compact/reviewed-commit.txt
          git archive --format=tar --output=/tmp/mini-games-source.tar HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-layout-review
          path: qa/screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mini-games-source
          path: /tmp/mini-games-source.tar
          retention-days: 1
